services:
  postgres:
    image: pgvector/pgvector:pg16

    container_name: devpilotNew-postgres

    environment:
      POSTGRES_DB: devpilotNew
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot

    ports:
      - "5434:5432"

    volumes:
      - devpilotNew_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d devpilotNew"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devpilotNew_pg_data: